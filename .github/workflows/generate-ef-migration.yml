name: Generate EF Core migration

on:
  push:
    branches:
      - feature/initial-ef-migration-v2

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DiabetesPlatform.sln

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.14

      - name: Generate migration
        run: |
          if [ ! -d "Infrastructure/Data/Migrations" ]; then
            dotnet ef migrations add InitialIdentityAndDomain --project Infrastructure --startup-project API --output-dir Data/Migrations
          else
            echo "Migration directory already exists; nothing to generate."
          fi

      - name: Commit generated migration
        run: |
          if git diff --quiet; then
            echo "No migration changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Infrastructure/Data/Migrations
          git commit -m "chore: add initial EF Core migration [skip ci]"
          git push
